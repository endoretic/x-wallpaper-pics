name: android-build

# 打包 Muzei 插件 APK: 跑单元测试, 有签名密钥时打 release 包, 否则打 debug 包
# main 分支上签名通过的包会发布到 Releases (永久保存; 构建产物受仓库保留天数限制, 很快就过期)
on:
  push:
    paths:
      - 'android-muzei-source/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android-muzei-source/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.verify.outputs.signed }}
      fingerprint: ${{ steps.verify.outputs.fingerprint }}
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: 解出签名密钥
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 单元测试并打包
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail      # 默认 shell 不带 pipefail, 否则 gradle 失败会被 tee 的退出码盖掉
          task=assembleDebug
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then task=assembleRelease; fi
          gradle -p android-muzei-source --console=plain testDebugUnitTest "$task" 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # 确认 release 包确实用 Secret 里的密钥签了名 (签名配置没生效时只会得到无法安装的 unsigned 包)
      - name: 核对 APK 签名
        id: verify
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=android-muzei-source/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::没有生成已签名的 app-release.apk, 签名配置可能没生效"; exit 1; fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          expected=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias release \
            | awk -F': ' '/SHA256:/ {gsub(":", "", $2); print tolower($2); exit}')
          actual=$("$apksigner" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK 签名证书与 Secret 里的密钥不一致 (APK: ${actual:-无签名})"; exit 1
          fi
          echo "::notice::APK 已用发布密钥签名, 证书 SHA-256: $actual"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"

      # 构建日志需要仓库管理员权限才能下载, 注解则公开可读: 失败时把关键错误转成注解, 方便排查
      - name: 把编译 / 测试错误转成注解
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/gradle.log" "$GITHUB_WORKSPACE" <<'PY'
          import sys
          lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          workspace = sys.argv[2].rstrip('/') + '/'
          def emit(text):
              text = text.replace('file://' + workspace, '').replace(workspace, '')[:4000]
              print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          count = 0
          for i, line in enumerate(lines):
              if count >= 9:
                  break
              if line.startswith('e: '):                       # Kotlin 编译错误
                  emit(line); count += 1
              elif ' FAILED' in line and '>' in line:          # 单元测试失败 (后面跟着断言信息)
                  emit('\n'.join([line] + lines[i + 1:i + 9])); count += 1
              elif line.startswith('* What went wrong:'):      # Gradle / AGP / 资源错误
                  block = []
                  for follow in lines[i + 1:i + 25]:
                      if follow.startswith('* Try:'):
                          break
                      block.append(follow)
                  emit('\n'.join(block).strip()); count += 1
          if count == 0:
              emit('\n'.join(lines[-30:]))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wallpaper-source-apk
          path: android-muzei-source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # 只有这个 job 能写仓库 (创建 Release), 打包 job 保持只读
  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wallpaper-source-apk
          path: apk

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          src=$(find apk -name 'app-release.apk' | head -1)
          if [ -z "$src" ]; then echo "::error::产物里没有 app-release.apk"; exit 1; fi
          cp "$src" "x-wallpaper-source-$VERSION.apk"
          {
            echo "Muzei 插件 APK，由 commit $GITHUB_SHA 构建。安装与配置见 android-muzei-source/README.md。"
            echo
            echo "签名证书 SHA-256：\`$FINGERPRINT\`"
          } > notes.md
          gh release create "muzei-source-v$VERSION" "x-wallpaper-source-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "X 壁纸源 $VERSION" --notes-file notes.md
          echo "::notice::已发布 muzei-source-v$VERSION"
