name: worker-test

# worker/ 有改动时跑类型检查和测试 (本地 workerd + 模拟 R2, 不需要任何密钥)
on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-test.yml'
  pull_request:
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
